<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>第 1 題結果</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0d0c;--surface:#121715;--sheet:#0e1211;--raised:#1e2522;--active:#232b28;--divider:#2a3330;--rule:#19201d;--grid:#222a27;--control:#3d4743;--chart3:#6c7470;--text:#f3f5f4;--text2:#e6eae8;--muted:#b3bab6;--faint:#959c98;--accent:#f2d45c;--accent-text:#f2d45c;--accent-stroke:#f2d45c;--accent-hover:#f6e08a;--on-accent:#1b1700;--accent-soft:#2a2614;--pos:#5fd394;--pos-bg:#14281c;--pos-ink:#6ad99c;--neg:#f0788c;--neg-bg:#2c1a20;--neg-ink:#f2879a;--on-neg:#1a0a0e;--warn:#e9b65a;--warn-bg:#2b2414;--warn-ink:#ecbd66;--scrim:rgba(5, 7, 6, 0.74);}
:root:has([data-theme="light"]){--ground:#f5f6f5;--surface:#ffffff;--sheet:#fafbfa;--raised:#eef1ef;--active:#e6eae8;--divider:#dde2df;--rule:#e7ebe9;--grid:#e1e6e3;--control:#c6cdc9;--chart3:#9aa29e;--text:#121614;--text2:#2a302d;--muted:#4f5753;--faint:#646c68;--accent:#efc419;--accent-text:#7a5d00;--accent-stroke:#a07a00;--accent-hover:#5c4600;--on-accent:#1b1700;--accent-soft:#fbf1c8;--pos:#247b50;--pos-bg:#dcfae5;--pos-ink:#0b5a2f;--neg:#c4242a;--neg-bg:#ffedea;--neg-ink:#831c1e;--on-neg:#ffffff;--warn:#b45309;--warn-bg:#fffbeb;--warn-ink:#92400e;--scrim:rgba(18, 22, 20, 0.45);}
body{margin:0;background:var(--ground)}
a{color: var(--accent-text)}a:hover{color: var(--accent-hover)}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
.pop{animation:pop .36s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.write{display:inline-block;animation:write .7s cubic-bezier(.65,0,.35,1) .5s both}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.breathe{animation:breathe 1.6s cubic-bezier(.65,0,.35,1) infinite}
@media (prefers-reduced-motion: reduce){.pop,.write,.breathe{animation:none}}
</style>
</head><body>
<div data-theme="light" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--text); font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule); flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" style="fill: var(--raised)"></rect><path d="M6 15.5c2.5-3 4.5-4.5 6.5-4.5" stroke-width="1.6" fill="none" stroke-linecap="round" style="stroke: var(--text)"></path><circle cx="16.5" cy="10" r="2.6" style="fill: var(--accent)"></circle></svg>
    <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--raised); font-weight: 600; font-size: 13px">第 3 組</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--raised); color: var(--text2); font-size: 12.5px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--muted)"></span>第 1 題已結束</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 24px 16px 28px; display: flex; flex-direction: column; gap: 14px">
    <span style="color: var(--muted); font-size: 14px">第 1 題 · 題組</span>
    <section class="pop" style="background: var(--accent-soft); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: inline-grid; place-items: center; min-width: 34px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600">#1</span>
        <h1 style="margin: 0; font-size: 24px; font-weight: 600">第 2 組搶到</h1>
      </div>
      <div style="display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 16px">
        <span style="color: var(--muted)">（1）</span><span class="write" style="font-weight: 600">CPU</span>
        <span style="color: var(--muted)">（2）</span><span class="write" style="font-weight: 600; animation-delay: .9s">作業系統</span>
      </div>
    </section>

    <section style="background: var(--surface); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600">本組的答案</h2>
      <span style="color: var(--text2)">（1）CPU　（2）OS</span>
      <span style="color: var(--faint); font-size: 12.5px">各組順位會在全部題目結束後公布。</span>
    </section>

    <section style="background: var(--surface); border-radius: 20px; padding: 14px 16px">
      <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600">題目進度</h2>
      <div style="display: grid; grid-template-columns: auto 1fr; gap: 0 12px; font-size: 13.5px">
        <b style="padding: 8px 0; font-weight: 600">第 1 題</b><span style="padding: 8px 0; color: var(--text2)">第 2 組搶到</span>
        <b style="padding: 8px 0; font-weight: 600; border-top: 1px solid var(--rule)">第 2 題</b><span style="padding: 8px 0; border-top: 1px solid var(--rule); color: var(--muted)">下一題</span>
        <b style="padding: 8px 0; font-weight: 600; border-top: 1px solid var(--rule); color: var(--faint)">第 3 題</b><span style="padding: 8px 0; border-top: 1px solid var(--rule); color: var(--faint)">未開放</span>
        <b style="padding: 8px 0; font-weight: 600; border-top: 1px solid var(--rule); color: var(--faint)">第 4 題</b><span style="padding: 8px 0; border-top: 1px solid var(--rule); color: var(--faint)">未開放</span>
      </div>
    </section>

    <p style="margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 14px"><span class="breathe" style="width: 8px; height: 8px; border-radius: 50%; background: var(--muted)"></span>等老師開放第 2 題</p>
  </main>
</div>
</body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>全部結果</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0d0c;--surface:#121715;--sheet:#0e1211;--raised:#1e2522;--active:#232b28;--divider:#2a3330;--rule:#19201d;--grid:#222a27;--control:#3d4743;--chart3:#6c7470;--text:#f3f5f4;--text2:#e6eae8;--muted:#b3bab6;--faint:#959c98;--accent:#f2d45c;--accent-text:#f2d45c;--accent-stroke:#f2d45c;--accent-hover:#f6e08a;--on-accent:#1b1700;--accent-soft:#2a2614;--pos:#5fd394;--pos-bg:#14281c;--pos-ink:#6ad99c;--neg:#f0788c;--neg-bg:#2c1a20;--neg-ink:#f2879a;--on-neg:#1a0a0e;--warn:#e9b65a;--warn-bg:#2b2414;--warn-ink:#ecbd66;--scrim:rgba(5, 7, 6, 0.74);}
:root:has([data-theme="light"]){--ground:#f5f6f5;--surface:#ffffff;--sheet:#fafbfa;--raised:#eef1ef;--active:#e6eae8;--divider:#dde2df;--rule:#e7ebe9;--grid:#e1e6e3;--control:#c6cdc9;--chart3:#9aa29e;--text:#121614;--text2:#2a302d;--muted:#4f5753;--faint:#646c68;--accent:#efc419;--accent-text:#7a5d00;--accent-stroke:#a07a00;--accent-hover:#5c4600;--on-accent:#1b1700;--accent-soft:#fbf1c8;--pos:#247b50;--pos-bg:#dcfae5;--pos-ink:#0b5a2f;--neg:#c4242a;--neg-bg:#ffedea;--neg-ink:#831c1e;--on-neg:#ffffff;--warn:#b45309;--warn-bg:#fffbeb;--warn-ink:#92400e;--scrim:rgba(18, 22, 20, 0.45);}
body{margin:0;background:var(--ground)}
a{color: var(--accent-text)}a:hover{color: var(--accent-hover)}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{animation:arrive .32s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.pop{display:inline-block;animation:pop .36s cubic-bezier(.34,1.56,.64,1) .2s both}
@media (prefers-reduced-motion: reduce){.row,.pop{animation:none}}
</style>
</head><body>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--text); font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule); flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" style="fill: var(--raised)"></rect><path d="M6 15.5c2.5-3 4.5-4.5 6.5-4.5" stroke-width="1.6" fill="none" stroke-linecap="round" style="stroke: var(--text)"></path><circle cx="16.5" cy="10" r="2.6" style="fill: var(--accent)"></circle></svg>
    <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--raised); font-weight: 600; font-size: 13px">第 3 組</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--raised); color: var(--text2); font-size: 12.5px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--muted)"></span>已結束</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 500; color: var(--muted)">本組搶到</h1>
      <span style="font-size: 36px; font-weight: 600; line-height: 1.2"><span class="pop">1</span><span style="font-size: 18px; font-weight: 500; margin-left: 4px">題</span></span>
      <span style="color: var(--muted); font-size: 14px">第 4 題，比第 4 組快 1.882 秒</span>
    </div>

    <section class="row d1" style="background: var(--surface); border-radius: 20px; padding: 12px 14px">
      <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600">第 1 題 · 題組</h2>
      <div style="display: grid; grid-template-columns: 36px 64px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; font-size: 13px">
        <span style="padding: 6px 0"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; font-weight: 600">#1</span></span><b style="padding: 6px 0; font-weight: 600">第 2 組</b><span style="padding: 6px 0">CPU／作業系統</span><span style="padding: 6px 0; color: var(--faint)"></span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#2</span></span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">第 5 組</span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">CPU／作業系統</span><span style="padding: 6px 0; border-top: 1px solid var(--rule); color: var(--faint)">+1.716</span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#3</span></span><b style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft); color: var(--accent-text); font-weight: 600">本組</b><span style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft)">CPU／OS</span><span style="padding: 6px 4px 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft); color: var(--faint)">+17.276</span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#4</span></span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">第 1 組</span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">CPU／OS</span><span style="padding: 6px 0; border-top: 1px solid var(--rule); color: var(--faint)">+28.705</span>
      </div>
    </section>

    <section class="row d2" style="background: var(--surface); border-radius: 20px; padding: 12px 14px">
      <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600">第 2 題 · 題組</h2>
      <div style="display: grid; grid-template-columns: 36px 64px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; font-size: 13px">
        <span style="padding: 6px 0"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; font-weight: 600">#1</span></span><b style="padding: 6px 0; font-weight: 600">第 5 組</b><span style="padding: 6px 0">演算法／堆疊</span><span style="padding: 6px 0"></span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#2</span></span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">第 2 組</span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">演算法／堆疊</span><span style="padding: 6px 0; border-top: 1px solid var(--rule); color: var(--faint)">+4.669</span>
      </div>
      <p style="margin: 6px 0 0; color: var(--faint); font-size: 12.5px">本組沒有送出</p>
    </section>

    <section class="row d3" style="background: var(--surface); border-radius: 20px; padding: 12px 14px">
      <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600">第 3 題 · 單題</h2>
      <div style="display: grid; grid-template-columns: 36px 64px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; font-size: 13px">
        <span style="padding: 6px 0"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; font-weight: 600">#1</span></span><b style="padding: 6px 0; font-weight: 600">第 1 組</b><span style="padding: 6px 0">0</span><span style="padding: 6px 0"></span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#2</span></span><b style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft); color: var(--accent-text); font-weight: 600">本組</b><span style="padding: 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft)">0</span><span style="padding: 6px 4px 6px 0; border-top: 1px solid var(--rule); background: var(--accent-soft); color: var(--faint)">+25.306</span>
      </div>
    </section>

    <section class="row d4" style="background: var(--accent-soft); border-radius: 20px; padding: 12px 14px">
      <h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 600">第 4 題 · 單題</h2>
      <div style="display: grid; grid-template-columns: 36px 64px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; font-size: 13px">
        <span style="padding: 6px 0"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; font-weight: 600">#1</span></span><b style="padding: 6px 0; color: var(--accent-text); font-weight: 600">本組</b><span style="padding: 6px 0">IP</span><span style="padding: 6px 0"></span>
        <span style="padding: 6px 0; border-top: 1px solid var(--rule)"><span style="display: inline-grid; place-items: center; min-width: 30px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: 11.5px; font-weight: 600">#2</span></span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">第 4 組</span><span style="padding: 6px 0; border-top: 1px solid var(--rule)">IP</span><span style="padding: 6px 0; border-top: 1px solid var(--rule); color: var(--faint)">+1.882</span>
      </div>
    </section>

    <p style="margin: 2px 0 0; color: var(--faint); font-size: 12.5px; text-align: center">+秒數是比第一名慢多少。老師開新一輪時，這個畫面會自動切換。</p>
  </main>
</div>
</body></html>

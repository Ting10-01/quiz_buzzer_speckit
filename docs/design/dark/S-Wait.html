<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>等待開始</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0d0c;--surface:#121715;--sheet:#0e1211;--raised:#1e2522;--active:#232b28;--divider:#2a3330;--rule:#19201d;--grid:#222a27;--control:#3d4743;--chart3:#6c7470;--text:#f3f5f4;--text2:#e6eae8;--muted:#b3bab6;--faint:#959c98;--accent:#f2d45c;--accent-text:#f2d45c;--accent-stroke:#f2d45c;--accent-hover:#f6e08a;--on-accent:#1b1700;--accent-soft:#2a2614;--pos:#5fd394;--pos-bg:#14281c;--pos-ink:#6ad99c;--neg:#f0788c;--neg-bg:#2c1a20;--neg-ink:#f2879a;--on-neg:#1a0a0e;--warn:#e9b65a;--warn-bg:#2b2414;--warn-ink:#ecbd66;--scrim:rgba(5, 7, 6, 0.74);}
:root:has([data-theme="light"]){--ground:#f5f6f5;--surface:#ffffff;--sheet:#fafbfa;--raised:#eef1ef;--active:#e6eae8;--divider:#dde2df;--rule:#e7ebe9;--grid:#e1e6e3;--control:#c6cdc9;--chart3:#9aa29e;--text:#121614;--text2:#2a302d;--muted:#4f5753;--faint:#646c68;--accent:#efc419;--accent-text:#7a5d00;--accent-stroke:#a07a00;--accent-hover:#5c4600;--on-accent:#1b1700;--accent-soft:#fbf1c8;--pos:#247b50;--pos-bg:#dcfae5;--pos-ink:#0b5a2f;--neg:#c4242a;--neg-bg:#ffedea;--neg-ink:#831c1e;--on-neg:#ffffff;--warn:#b45309;--warn-bg:#fffbeb;--warn-ink:#92400e;--scrim:rgba(18, 22, 20, 0.45);}
body{margin:0;background:var(--ground)}
a{color: var(--accent-text)}a:hover{color: var(--accent-hover)}
a:focus-visible{outline:2px solid var(--accent-stroke);outline-offset:2px}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
.breathe{animation:breathe 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ring{animation:ring 2.4s cubic-bezier(.2,.8,.2,1) infinite}
@media (prefers-reduced-motion: reduce){.breathe,.ring{animation:none}}
</style>
</head><body>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--text); font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule); flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" style="fill: var(--raised)"></rect><path d="M6 15.5c2.5-3 4.5-4.5 6.5-4.5" stroke-width="1.6" fill="none" stroke-linecap="round" style="stroke: var(--text)"></path><circle cx="16.5" cy="10" r="2.6" style="fill: var(--accent)"></circle></svg>
    <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--raised); font-weight: 600; font-size: 13px">第 3 組</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12.5px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--warn)"></span>準備中</span>
  </header>

  <main style="flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
      <div style="position: relative; width: 112px; height: 112px; display: grid; place-items: center">
        <span class="ring" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--control)"></span>
        <span class="breathe" style="width: 88px; height: 88px; border-radius: 50%; background: var(--surface); display: grid; place-items: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--text)"><path d="M7 3h10"></path><path d="M7 21h10"></path><path d="M8 3c0 5 8 5 8 9s-8 4-8 9"></path><path d="M16 3c0 5-8 5-8 9s8 4 8 9"></path></svg>
        </span>
      </div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600">等老師開放第 1 題</h1>
      <p style="margin: 0; color: var(--muted); font-size: 15px; max-width: 290px">老師開放題目後，這個畫面會自動切換，不用重新整理。</p>
    </div>

    <ol aria-label="活動階段" style="margin: 0; padding: 4px; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--surface); border-radius: 999px; font-size: 13px; text-align: center">
      <li style="height: 32px; display: grid; place-items: center; border-radius: 999px; background: var(--text); color: var(--ground); font-weight: 600">準備中</li>
      <li style="height: 32px; display: grid; place-items: center; color: var(--muted)">搶答中</li>
      <li style="height: 32px; display: grid; place-items: center; color: var(--muted)">已結束</li>
    </ol>

    <section style="background: var(--surface); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">這一輪</h2>
      <ul style="margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 14px">
        <li>4 題，老師一題一題開放，每題 60 秒</li>
        <li>第 1、2 題是題組，要整組一起送出</li>
        <li>每組每題只能送一次，送出後不能改</li>
        <li>每題結束就公布誰搶到；全部結束後看得到各組答案</li>
      </ul>
    </section>

    <a href="S-Join.dc.html" style="align-self: center; display: inline-flex; align-items: center; min-height: 44px; color: var(--muted); font-size: 14px">選錯組別？重新選擇</a>
  </main>
</div>
</body></html>

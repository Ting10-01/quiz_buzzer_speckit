<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>選擇組別</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0d0c;--surface:#121715;--sheet:#0e1211;--raised:#1e2522;--active:#232b28;--divider:#2a3330;--rule:#19201d;--grid:#222a27;--control:#3d4743;--chart3:#6c7470;--text:#f3f5f4;--text2:#e6eae8;--muted:#b3bab6;--faint:#959c98;--accent:#f2d45c;--accent-text:#f2d45c;--accent-stroke:#f2d45c;--accent-hover:#f6e08a;--on-accent:#1b1700;--accent-soft:#2a2614;--pos:#5fd394;--pos-bg:#14281c;--pos-ink:#6ad99c;--neg:#f0788c;--neg-bg:#2c1a20;--neg-ink:#f2879a;--on-neg:#1a0a0e;--warn:#e9b65a;--warn-bg:#2b2414;--warn-ink:#ecbd66;--scrim:rgba(5, 7, 6, 0.74);}
:root:has([data-theme="light"]){--ground:#f5f6f5;--surface:#ffffff;--sheet:#fafbfa;--raised:#eef1ef;--active:#e6eae8;--divider:#dde2df;--rule:#e7ebe9;--grid:#e1e6e3;--control:#c6cdc9;--chart3:#9aa29e;--text:#121614;--text2:#2a302d;--muted:#4f5753;--faint:#646c68;--accent:#efc419;--accent-text:#7a5d00;--accent-stroke:#a07a00;--accent-hover:#5c4600;--on-accent:#1b1700;--accent-soft:#fbf1c8;--pos:#247b50;--pos-bg:#dcfae5;--pos-ink:#0b5a2f;--neg:#c4242a;--neg-bg:#ffedea;--neg-ink:#831c1e;--on-neg:#ffffff;--warn:#b45309;--warn-bg:#fffbeb;--warn-ink:#92400e;--scrim:rgba(18, 22, 20, 0.45);}
body{margin:0;background:var(--ground)}
a{color: var(--accent-text)}a:hover{color: var(--accent-hover)}
.gp{transition:background .2s cubic-bezier(.2,.8,.2,1),border-color .2s,transform .12s cubic-bezier(.2,.8,.2,1)}
.gp:active{transform:scale(.97)}
.gp:focus-visible,.btn:focus-visible{outline:2px solid var(--accent-stroke);outline-offset:2px}
.btn{transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.gp,.btn{transition:none}}
</style>
</head><body>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--text); font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule); flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" style="fill: var(--raised)"></rect><path d="M6 15.5c2.5-3 4.5-4.5 6.5-4.5" stroke-width="1.6" fill="none" stroke-linecap="round" style="stroke: var(--text)"></path><circle cx="16.5" cy="10" r="2.6" style="fill: var(--accent)"></circle></svg>
    <span style="font-weight: 600; font-size: 16px">搶答板</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12.5px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--warn)"></span>準備中</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">選擇你的組別</h1>
      <p style="margin: 0; color: var(--muted); font-size: 14px">計算機概論基礎 學習單 · 4 題</p>
    </div>
    <div role="radiogroup" aria-label="組別" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      
        <button class="gp" type="button" role="radio" aria-checked="false" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--raised); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 1 組</span>
          <span style="color: var(--muted); font-size: 13px">3 人在線</span>
        </button>
      
        <button class="gp" type="button" role="radio" aria-checked="false" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--raised); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 2 組</span>
          <span style="color: var(--muted); font-size: 13px">2 人在線</span>
        </button>
      
        <button class="gp" type="button" role="radio" aria-checked="true" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--text); background: var(--active); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 3 組</span>
          <span style="color: var(--muted); font-size: 13px">2 人在線</span>
        </button>
      
        <button class="gp" type="button" role="radio" aria-checked="false" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--raised); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 4 組</span>
          <span style="color: var(--muted); font-size: 13px">2 人在線</span>
        </button>
      
        <button class="gp" type="button" role="radio" aria-checked="false" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--raised); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 5 組</span>
          <span style="color: var(--muted); font-size: 13px">3 人在線</span>
        </button>
      
        <button class="gp" type="button" role="radio" aria-checked="false" style="text-align: left; min-height: 76px; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--raised); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 17px; font-weight: 600">第 6 組</span>
          <span style="color: var(--muted); font-size: 13px">還沒有人</span>
        </button>
      
    </div>
    <p style="margin: 0; color: var(--faint); font-size: 13px">同一組可以有多位同學，任何人送出都代表整組。</p>
  </main>

  <footer style="flex: none; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule)">
    <span style="color: var(--muted); font-size: 13px; text-align: center">第 1 題開放後就不能換組</span>
    <a class="btn" href="S-Wait.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: var(--text); color: var(--ground); text-decoration: none; font-weight: 600; font-size: 16px">加入第 3 組</a>
  </footer>
</div>
</body></html>

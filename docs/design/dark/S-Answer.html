<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>作答第 1 題</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0a0d0c;--surface:#121715;--sheet:#0e1211;--raised:#1e2522;--active:#232b28;--divider:#2a3330;--rule:#19201d;--grid:#222a27;--control:#3d4743;--chart3:#6c7470;--text:#f3f5f4;--text2:#e6eae8;--muted:#b3bab6;--faint:#959c98;--accent:#f2d45c;--accent-text:#f2d45c;--accent-stroke:#f2d45c;--accent-hover:#f6e08a;--on-accent:#1b1700;--accent-soft:#2a2614;--pos:#5fd394;--pos-bg:#14281c;--pos-ink:#6ad99c;--neg:#f0788c;--neg-bg:#2c1a20;--neg-ink:#f2879a;--on-neg:#1a0a0e;--warn:#e9b65a;--warn-bg:#2b2414;--warn-ink:#ecbd66;--scrim:rgba(5, 7, 6, 0.74);}
:root:has([data-theme="light"]){--ground:#f5f6f5;--surface:#ffffff;--sheet:#fafbfa;--raised:#eef1ef;--active:#e6eae8;--divider:#dde2df;--rule:#e7ebe9;--grid:#e1e6e3;--control:#c6cdc9;--chart3:#9aa29e;--text:#121614;--text2:#2a302d;--muted:#4f5753;--faint:#646c68;--accent:#efc419;--accent-text:#7a5d00;--accent-stroke:#a07a00;--accent-hover:#5c4600;--on-accent:#1b1700;--accent-soft:#fbf1c8;--pos:#247b50;--pos-bg:#dcfae5;--pos-ink:#0b5a2f;--neg:#c4242a;--neg-bg:#ffedea;--neg-ink:#831c1e;--on-neg:#ffffff;--warn:#b45309;--warn-bg:#fffbeb;--warn-ink:#92400e;--scrim:rgba(18, 22, 20, 0.45);}
body{margin:0;background:var(--ground)}
a{color: var(--accent-text)}a:hover{color: var(--accent-hover)}
.btn{transition:transform .12s cubic-bezier(.2,.8,.2,1),opacity .2s}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.in:focus-visible{outline:2px solid var(--accent-stroke);outline-offset:2px}
.in{transition:border-color .2s}
.in:focus{border-color:var(--text);outline:none}
.bar{transition:width 1s linear}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.arrive{animation:arrive .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.breathe{animation:breathe 1.6s cubic-bezier(.65,0,.35,1) infinite}
@media (prefers-reduced-motion: reduce){.arrive,.breathe{animation:none}.btn,.in,.bar{transition:none}}
</style>
</head><body>
<div data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--text); font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--rule); flex: none">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" style="fill: var(--raised)"></rect><path d="M6 15.5c2.5-3 4.5-4.5 6.5-4.5" stroke-width="1.6" fill="none" stroke-linecap="round" style="stroke: var(--text)"></path><circle cx="16.5" cy="10" r="2.6" style="fill: var(--accent)"></circle></svg>
    <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--raised); font-weight: 600; font-size: 13px">第 3 組</span>
    <span style="color: var(--muted); font-size: 13px">第 1 題 / 共 4 題</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--pos-bg); color: var(--pos-ink); font-size: 14px; font-weight: 600">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M9 2h6"></path></svg>0:30
    </span>
  </header>
  <div style="height: 4px; background: var(--raised); flex: none"><div class="bar" style="height: 100%; width: 50%; background: var(--pos)"></div></div>

  <main style="flex: 1; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">第 1 題 · 題組</h1>
      <p style="margin: 0; color: var(--muted); font-size: 13.5px">兩個小題都要填，整組一起送出。每組只能送一次。</p>
    </div>

    <section style="background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
      
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="q1-0" style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600; font-size: 14px">（1）</span>
            <span style="color: var(--muted); font-size: 13.5px; line-height: 1.6">根據文章第一段，小明升級的電腦「大腦」硬體，其英文簡稱是什麼？</span>
          </label>
          <input class="in" id="q1-0" value="CPU" maxlength="200" autocomplete="off" placeholder="輸入答案" style="height: 44px; border-radius: 10px; border: 1px solid var(--control); background: var(--surface); color: var(--text); padding: 0 12px; font-size: 16px; font-family: inherit">
        </div>
      
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="q1-1" style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600; font-size: 14px">（2）</span>
            <span style="color: var(--muted); font-size: 13.5px; line-height: 1.6">而他安裝的 Windows 負責管理電腦的軟硬體資源，這種系統軟體統稱為什麼？</span>
          </label>
          <input class="in" id="q1-1" value="" maxlength="200" autocomplete="off" placeholder="輸入答案" style="height: 44px; border-radius: 10px; border: 1px solid var(--control); background: var(--surface); color: var(--text); padding: 0 12px; font-size: 16px; font-family: inherit">
        </div>
      
      
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px">
        
        
          <span style="color: var(--faint); font-size: 12.5px">每一格都填才能送出</span>
        
        <button class="btn" type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--text); color: var(--ground); font-weight: 600; font-size: 15px; font-family: inherit; cursor: pointer">整組送出</button>
      </div>
    </section>

    
    
  </main>
</div>
</body></html>
